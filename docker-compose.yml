version: '3.8'

services:
  backend:
    build:
      context: .
      target: backend
    container_name: nexus-fleet-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      target: frontend
    container_name: nexus-fleet-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - PORT=5173
      - BASE_PATH=/
    restart: always
