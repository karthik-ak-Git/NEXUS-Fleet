[project]
name = "nexus-fleet"
version = "1.0.0"
description = "Edge-AI Based Distributed Fleet Coordination for Autonomous Mobile Robots in Smart Warehouses"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "websockets>=12.0",
    "google-genai>=0.1.0",
    "chromadb>=1.5.9",
    "supabase>=2.31.0",
    "sqlalchemy>=2.0.54",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.13",
    "aiosqlite>=0.22.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
